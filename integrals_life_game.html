<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Интегралы в жизни человека</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-container {
      width: 90%;
      max-width: 900px;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
    }

    h1 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 25px;
      color: #cbd5e1;
    }

    .card {
      background: rgba(255,255,255,0.07);
      border-radius: 15px;
      padding: 20px;
      margin-top: 20px;
    }

    .question {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .answers button {
      width: 100%;
      margin: 10px 0;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #334155;
      color: white;
      font-size: 17px;
      cursor: pointer;
      transition: 0.3s;
    }

    .answers button:hover {
      background: #0ea5e9;
      transform: scale(1.02);
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      display: none;
      font-size: 18px;
    }

    .correct {
      background: rgba(34,197,94,0.2);
      border: 1px solid #22c55e;
    }

    .wrong {
      background: rgba(239,68,68,0.2);
      border: 1px solid #ef4444;
    }

    .score {
      text-align: center;
      font-size: 22px;
      margin-top: 20px;
      color: #facc15;
    }

    .next-btn, .restart-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: none;
      transition: 0.3s;
    }

    .next-btn:hover, .restart-btn:hover {
      background: #16a34a;
    }

    .formula {
      margin-top: 10px;
      color: #7dd3fc;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>Интегралы в жизни человека</h1>
    <div class="subtitle">Обучающая HTML-игра для проекта по математике</div>

    <div class="score">Очки: <span id="score">0</span></div>

    <div class="card">
      <div class="question" id="question"></div>
      <div class="formula" id="formula"></div>
      <div class="answers" id="answers"></div>
      <div class="result" id="result"></div>
      <button class="next-btn" id="nextBtn">Следующий вопрос</button>
      <button class="restart-btn" id="restartBtn">Играть снова</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: 'Где интегралы помогают вычислять пройденный путь?',
        formula: 'S = ∫ v(t) dt',
        answers: ['В музыке', 'В движении автомобиля', 'В рисовании', 'В фотографии'],
        correct: 1,
        explanation: 'Интеграл скорости по времени позволяет найти путь автомобиля.'
      },
      {
        question: 'Для чего интегралы применяются в медицине?',
        formula: 'A = ∫ C(t) dt',
        answers: ['Подсчёт лайков', 'Расчёт температуры телефона', 'Подсчёт воздействия лекарства', 'Создание паролей'],
        correct: 2,
        explanation: 'Интегралы помогают вычислить суммарное действие лекарства.'
      },
      {
        question: 'Что вычисляют интегралы в физике?',
        formula: 'A = ∫ F(x) dx',
        answers: ['Работу силы', 'Цвет объекта', 'Громкость музыки', 'Размер шрифта'],
        correct: 0,
        explanation: 'Интеграл силы по расстоянию вычисляет работу.'
      },
      {
        question: 'Где интегралы используются в экологии?',
        formula: 'Q = ∫ q(t) dt',
        answers: ['Подсчёт загрязнения воздуха', 'Создание мемов', 'Печать текста', 'Установка игр'],
        correct: 0,
        explanation: 'Интегралы помогают определить общее количество загрязнений.'
      },
      {
        question: 'Что помогает находить интеграл в 3D-моделировании?',
        formula: 'V = π∫ y² dx',
        answers: ['Объём фигуры', 'Имя пользователя', 'Скорость интернета', 'Вес книги'],
        correct: 0,
        explanation: 'Интегралы используются для вычисления объёма тел вращения.'
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    const questionEl = document.getElementById('question');
    const formulaEl = document.getElementById('formula');
    const answersEl = document.getElementById('answers');
    const resultEl = document.getElementById('result');
    const nextBtn = document.getElementById('nextBtn');
    const restartBtn = document.getElementById('restartBtn');
    const scoreEl = document.getElementById('score');

    function loadQuestion() {
      resultEl.style.display = 'none';
      nextBtn.style.display = 'none';

      const q = questions[currentQuestion];
      questionEl.textContent = q.question;
      formulaEl.textContent = q.formula;
      answersEl.innerHTML = '';

      q.answers.forEach((answer, index) => {
        const btn = document.createElement('button');
        btn.textContent = answer;
        btn.onclick = () => checkAnswer(index);
        answersEl.appendChild(btn);
      });
    }

    function checkAnswer(index) {
      const q = questions[currentQuestion];

      const buttons = answersEl.querySelectorAll('button');
      buttons.forEach(btn => btn.disabled = true);

      resultEl.style.display = 'block';

      if(index === q.correct) {
        score++;
        scoreEl.textContent = score;
        resultEl.className = 'result correct';
        resultEl.innerHTML = '✅ Верно!<br><br>' + q.explanation;
      } else {
        resultEl.className = 'result wrong';
        resultEl.innerHTML = '❌ Неверно.<br><br>' + q.explanation;
      }

      if(currentQuestion < questions.length - 1) {
        nextBtn.style.display = 'block';
      } else {
        restartBtn.style.display = 'block';
        questionEl.textContent = 'Игра завершена!';
        formulaEl.textContent = '';
      }
    }

    nextBtn.addEventListener('click', () => {
      currentQuestion++;
      loadQuestion();
    });

    restartBtn.addEventListener('click', () => {
      currentQuestion = 0;
      score = 0;
      scoreEl.textContent = score;
      restartBtn.style.display = 'none';
      loadQuestion();
    });

    loadQuestion();
  </script>
</body>
</html>
